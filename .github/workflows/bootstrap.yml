name: OpenStream Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "OpenStream Builder"
          git config user.email "actions@users.noreply.github.com"

      - name: Create repository structure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            apps/windows \
            apps/android \
            core \
            docs \
            packaging \
            scripts \
            third_party

      - name: Create project manifest
        shell: bash
        run: |
          cat > OPENSTREAM_BUILD.md <<'EOF'
          # OpenStream Build Manifest

          OpenStream is a custom modern UI and product layer built around
          proven low-latency game-streaming technology.

          ## Upstream components

          Windows host:
          https://github.com/LizardByte/Sunshine

          Android/client streaming core:
          https://github.com/moonlight-stream/moonlight-common-c

          Android client:
          https://github.com/moonlight-stream/moonlight-android

          ## Product goals

          - Modern OpenStream UI
          - Low-latency game streaming
          - AV1 / HEVC / H.264
          - Hardware encoding/decoding
          - Gamepad input
          - Keyboard/mouse
          - Audio
          - Adaptive bitrate
          - Meshnet-friendly networking
          - Pairing/security
          - Connection diagnostics

          ## Important

          OpenStream must retain all applicable upstream license notices
          and source-code/license obligations.

          Do not remove copyright notices from upstream components.
          EOF

      - name: Create upstream manifest
        shell: bash
        run: |
          cat > upstream-components.txt <<'EOF'
          # OpenStream upstream components

          LizardByte Sunshine
          https://github.com/LizardByte/Sunshine

          Moonlight Android
          https://github.com/moonlight-stream/moonlight-android

          Moonlight common-c
          https://github.com/moonlight-stream/moonlight-common-c
          EOF

      - name: Create initial documentation
        shell: bash
        run: |
          cat > docs/ARCHITECTURE.md <<'EOF'
          # OpenStream Architecture

          ## Host

          OpenStream Host runs on Windows and provides:

          1. Game discovery
          2. Game launching
          3. GPU capture
          4. Hardware video encoding
          5. Audio capture
          6. Input handling
          7. Network/session management

          ## Client

          OpenStream Client runs on Android and provides:

          1. Device pairing
          2. Game library
          3. Hardware video decoding
          4. Audio playback
          5. Gamepad input
          6. Keyboard/mouse input
          7. Touch controls
          8. Streaming diagnostics

          ## UX

          The OpenStream UI is independent of the Sunshine web UI and
          Moonlight Android UI.

          The streaming engine and UX are separate layers.

          ## Network

          The preferred topology is:

              Windows PC
                  |
              Meshnet/private network
                  |
              Android tablet

          OpenStream should prefer direct connectivity when available.

          ## Codec preference

          The client and host negotiate the best mutually supported codec:

              AV1
               |
              HEVC
               |
              H.264

          Hardware capability always takes precedence over theoretical
          codec availability.
          EOF

      - name: Commit bootstrap
        shell: bash
        run: |
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Bootstrap OpenStream architecture"
          git push
